spring:
    application:
        name: promotion-service
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ticsys_promotion_service_db}
        username: ${DAT_USERNAME:postgres}
        password: ${DATA_PASSWORD:pqkiet854A@}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate.ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

server:
    port: 8087

logging:
    level:
        root: INFO
        '[org.springframework.security]': DEBUG
    

eureka:
    client:
        enabled: false  # Tắt Eureka client
        register-with-eureka: false
        fetch-registry: false
