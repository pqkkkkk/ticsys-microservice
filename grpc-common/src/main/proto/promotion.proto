syntax = "proto3";

package org.pqkkkk.ticsys.grpc.promotion;

option java_multiple_files = true;
option java_package = "org.pqkkkk.ticsys.grpc.promotion";
option java_outer_classname = "PromotionServiceProto";

// Service definition
service PromotionService {
    rpc ApplyPromotion (ApplyPromotionRequest) returns (ApplyPromotionResponse);
}

// Request message for applying a promotion
message ApplyPromotionRequest {
    int64 promotion_id = 1; // The promotion ID to be applied
    int64 user_id = 2; // The ID of the user applying the promotion
    int64 event_id = 3; // The ID of the event for which the promotion is applied
    int64 event_date_id = 4; // The ID of the specific date of the event
    double original_price = 5; // The original price before applying the promotion
    string voucher_code = 6; // The voucher code if applicable
    string voucher_type = 8; // The type of voucher (e.g., SINGLE_CODE, BULK_CODE)
    int32 ticket_quantity = 7; // The quantity of tickets or items
}
// Response message for applying a promotion
message ApplyPromotionResponse {
    bool success = 1; // Indicates if the promotion was successfully applied
    string message = 2; // Additional message or error information
    double discount_amount = 3; // The amount of discount applied
}